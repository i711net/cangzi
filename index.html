<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>藏字 · 离线读写器</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f2;color:#172622;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}main{max-width:820px;margin:36px auto;padding:0 18px}h1,h2{line-height:1.25}h1{margin-bottom:6px}header p,small{color:#455951}section{background:#fff;border:1px solid #d4ded8;border-radius:14px;padding:22px;margin-top:18px}h2{margin:0 0 14px;font-size:22px}label{display:block;font-weight:650;margin-top:12px}textarea,input[type=password]{display:block;width:100%;border:1px solid #83978e;border-radius:7px;padding:9px;font:inherit;color:inherit;background:white}textarea{resize:vertical}button{margin:10px 8px 0 0;padding:7px 14px;border-radius:7px;border:1px solid #21564a;background:#fff;color:#21564a;font:inherit;cursor:pointer}button.primary{background:#21564a;color:white}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #478e7a;outline-offset:2px}.status{margin:8px 0;color:#21564a;min-height:1.6em}.error{color:#a02c20}details{margin:18px 0}summary{cursor:pointer}input[type=file]{max-width:100%}
</style>
<main>
<header><h1>藏字</h1><p>把一段秘密藏进普通文章，用密码在本机解读。</p></header>
<section>
<h2>写入秘密</h2>
<label for="cover">公开文章</label>
<textarea id="cover" rows="6" placeholder="从 Word 复制正文到这里，或导入 TXT 后编辑。"></textarea>
<label for="source">导入 TXT（UTF-8）</label><input type="file" id="source" accept=".txt,text/plain">
<label for="secret">秘密正文</label><textarea id="secret" rows="3" placeholder="这里写接收方解锁后要看到的内容。"></textarea>
<label for="writePassword">设置密码</label><input type="password" id="writePassword" autocomplete="new-password" placeholder="至少 12 个字符；建议用长口令">
<label for="mode">分享方式</label>
<select id="mode"><option value="words">正文措辞（适合复制到微信 / QQ）</option><option value="invisible">隐形正文（建议通过 TXT 文件发送）</option></select>
<p><small id="capacity"></small></p>
<button class="primary" id="encode">生成带密文章</button>
<label for="encoded">带密文章</label><textarea id="encoded" rows="4" readonly></textarea>
<button id="copy" disabled>复制带密文章</button><button id="save" disabled>保存 TXT</button>
<p id="writeStatus" class="status" role="status"></p>
</section>
<section>
<h2>检查与解读</h2>
<label for="received">收到的文章</label><textarea id="received" rows="5" placeholder="粘贴完整文章，或者导入带密 TXT。"></textarea>
<label for="incoming">导入带密 TXT（UTF-8）</label><input type="file" id="incoming" accept=".txt,text/plain">
<div><button id="check">检查是否有密文</button></div>
<label for="readPassword">解读密码</label><input type="password" id="readPassword" autocomplete="off">
<button class="primary" id="decode">解锁秘密</button>
<p id="readStatus" class="status" role="status"></p>
<label for="revealed">解锁后的秘密</label><textarea id="revealed" rows="4" readonly></textarea>
</section>
<details><summary>微信和 QQ 怎么发？</summary><p>选择「正文措辞」，生成后复制整篇文章。工具用可互换的中文短语携带密文。请先读一遍，确认语气和意思合适。接收方粘贴完整正文并输入密码。删句、改词或只复制一部分都可能导致解不开。</p><p>可替换词句太少时，需要补充原稿或缩短秘密。隐形正文模式适合以 TXT 文件发送，接收方下载后直接导入。</p><p>本页在浏览器内加密解密，请使用长且独立的口令，并单独把口令交给接收方。</p></details>
</main>
<script>
'use strict';
const te = new TextEncoder(), td = new TextDecoder('utf-8', {fatal:true});
const alphabet = '\u200b\u2060\u2062\u2063';
const start = '\u2064\u2061\u2064\u2061', end = '\u2061\u2064\u2061\u2064';
const magic = te.encode('CZ01');
const maxSecret = 8192, overhead = 48;
const packetPattern = new RegExp(start+'(['+alphabet+']+)'+end, 'g');
const chatPattern = /\[CZ1:([A-Za-z0-9_\- \r\n\t]+)\]/g;
// Keep these pairs and their order stable so published articles remain readable.
const wordingPairs = [
  ['换句话说','换个说法'], ['与此同时','同一时间'], ['从那以后','从那之后'],
  ['举个例子','举个事例'], ['比方来说','比如说'], ['总的来说','整体来看'],
  ['一开始的时候','刚开始的时候'], ['等到那时候','等到那个时候'],
  ['在这个过程中','在这一过程中'], ['在那段时间里','在那一段时间里'],
  ['经过一段时间','过了一段时间'], ['没过多久','没过多长时间'],
  ['接下来的几天','之后的几天'], ['过了好一会儿','过了好一阵子'],
  ['下班以后','下班之后'], ['吃完饭以后','吃完饭之后'], ['回到家以后','回到家之后'],
  ['走了一小段路','走了一小截路'], ['停下了脚步','停住了脚步'],
  ['仔细想了想','认真想了想'], ['简单说了几句','简单讲了几句'],
  ['提前说一声','事先说一声'], ['抽空看一看','抽空看一下'],
  ['找个时间聊聊','找个时间聊一聊'], ['再确认一下','再确认一遍'],
  ['把事情说清楚','把事情讲清楚'], ['把情况说清楚','把情况讲清楚'],
  ['有机会的话','如果有机会'], ['有需要的话','如果有需要'],
  ['到时候再说','到时候再谈'], ['等有空了','等有时间了'],
  ['一块儿过去','一起过去'], ['一块儿回来','一起回来'],
  ['街道旁边','街道边上'], ['附近的地方','周围的地方'],
  ['周末的时候','到了周末的时候'], ['过一会儿','过一阵子']
];
const wordingIndex = new Map(wordingPairs.flatMap(pair => pair.map(word => [word,pair])));
const wordingPattern = new RegExp([...wordingIndex.keys()].sort((a,b)=>b.length-a.length).join('|'),'g');
function readWords(article) {
  const bits = Array.from(article.matchAll(wordingPattern), ([word]) => wordingIndex.get(word).indexOf(word));
  const bytes = new Uint8Array(Math.floor(bits.length/8));
  for (let i=0;i<bytes.length*8;i++) bytes[i>>3] |= bits[i] << (7-i%8);
  if (!magic.every((value,i)=>bytes[i]===value)) return null;
  if (bytes.length<6) throw Error('正文不完整。');
  const size = bytes[4]*256+bytes[5];
  if (size<=overhead || size>overhead+maxSecret || bytes.length<size+6) throw Error('正文不完整，请复制整篇文章。');
  return validatePacket(bytes.slice(6,6+size));
}
function writeWords(article, packet) {
  const frame = new Uint8Array(packet.length+6);
  frame.set(magic);
  new DataView(frame.buffer).setUint16(4,packet.length);
  frame.set(packet,6);
  let bit = 0;
  const result = article.replace(wordingPattern, word => {
    if (bit>=frame.length*8) return word;
    const value = (frame[bit>>3]>>(7-bit%8))&1;
    bit++;
    return wordingIndex.get(word)[value];
  });
  const recovered = readWords(result);
  if (!recovered || !packet.every((byte,i)=>recovered[i]===byte)) throw Error('改写后无法完整解读，请换一篇原稿。');
  return result;
}
function validatePacket(bytes) {
  if (bytes.length <= overhead || bytes.length > overhead+maxSecret) throw Error('密文长度不正确，可能在复制时受损。');
  if (!magic.every((n,i)=>n===bytes[i])) throw Error('无法识别密文格式。');
  return bytes;
}
function pack(bytes) {
  return start + Array.from(bytes, x => alphabet[x>>6]+alphabet[(x>>4)&3]+alphabet[(x>>2)&3]+alphabet[x&3]).join('') + end;
}
function extract(article) {
  const chatMatches = article.matchAll(chatPattern);
  const chat = chatMatches.next();
  const matches = article.matchAll(packetPattern);
  const first = matches.next();
  if (!chat.done) {
    if (!chatMatches.next().done || !first.done) throw Error('文章内有多段密文。请分别载入原始文章或分享码。');
    const data = chat.value[1].replace(/[ \r\n\t]/g,'');
    if (data.length > Math.ceil((overhead+maxSecret)*4/3) || data.length%4===1) throw Error('分享码长度不正确，请检查是否完整。');
    return validatePacket(Uint8Array.from(atob(data.replace(/-/g,'+').replace(/_/g,'/')),x=>x.charCodeAt(0)));
  }
  if (first.done) {
    const wording = readWords(article);
    if (wording) return wording;
    throw Error('未找到完整密文。请粘贴整篇文章。');
  }
  if (!matches.next().done) throw Error('文章内有多段密文。请分别载入原始文章。');
  const data = first.value[1];
  if (data.length % 4 || data.length < (overhead+1)*4 || data.length > (overhead+maxSecret)*4) throw Error('密文长度不正确，可能在复制时受损。');
  const bytes = new Uint8Array(data.length/4);
  for(let i=0;i<bytes.length;i++) {
    for(let j=0;j<4;j++) bytes[i] = 4*bytes[i] + alphabet.indexOf(data[4*i+j]);
  }
  return validatePacket(bytes);
}
async function derive(password,salt,usage) {
  if (!globalThis.crypto?.subtle) throw Error('当前浏览器无法使用本机加密，请用 Edge 或 Chrome 打开本页。');
  const root = await crypto.subtle.importKey('raw',te.encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:600000,hash:'SHA-256'},root,{name:'AES-GCM',length:256},false,[usage]);
}
async function hide(article, secret, password, mode='invisible') {
  if (!article.trim()) throw Error('请输入公开文章。');
  if (article.includes(start) || article.includes('[CZ1:')) throw Error('文章已含密文标记，请换用公开原稿。');
  const payload = te.encode(secret);
  if (!payload.length || payload.length > maxSecret) throw Error('秘密正文须为 1 至 8192 个 UTF-8 字节，常见汉字约占 3 字节。');
  if (mode==='words') {
    const available = Array.from(article.matchAll(wordingPattern)).length;
    const required = (overhead+6+payload.length)*8;
    if (available<required) throw Error('这篇原稿有 '+available+' 处可替换措辞，这条秘密需要 '+required+' 处。请用更长的原稿或缩短秘密。');
  }
  if (Array.from(password).length < 12) throw Error('请设置至少 12 个字符的密码。');
  const header = new Uint8Array(32);
  header.set(magic);
  crypto.getRandomValues(header.subarray(4));
  const key = await derive(password,header.subarray(4,20),'encrypt');
  const encrypted = new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv:header.subarray(20),additionalData:header},key,payload));
  const bytes = new Uint8Array(header.length+encrypted.length);
  bytes.set(header);bytes.set(encrypted,header.length);
  if(mode==='words') return writeWords(article,bytes);
  const pos = article.search(/[。！？\n]/);
  const insertion = pos >= 0 ? pos : Array.from(article.trimStart())[0].length + article.length-article.trimStart().length;
  return article.slice(0,insertion)+pack(bytes)+article.slice(insertion);
}
async function reveal(article,password) {
  const bytes = extract(article);
  if (!password) throw Error('请输入解读密码。');
  const key=await derive(password,bytes.subarray(4,20),'decrypt');
  try {
    return td.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.subarray(20,32),additionalData:bytes.subarray(0,32)},key,bytes.subarray(32)));
  } catch { throw Error('密码错误，或密文在传播过程中受损。'); }
}
const $ = id => document.getElementById(id);
function status(id,message,error=false) {
  $(id).textContent=message;$(id).classList.toggle('error',error);
}
function changed() { $('revealed').value='';status('readStatus',''); }
for(const id of ['received','readPassword']) $(id).oninput=changed;
for(const [file,target,notice] of [['source','cover','writeStatus'],['incoming','received','readStatus']]) {
  $(file).onchange=async () => {
    const f=$(file).files[0];$(file).value='';
    if(!f) return;
    try {
      if(f.size>8*1024*1024) throw Error('请选择小于等于 8 MB 的 TXT。');
      const content=td.decode(await f.arrayBuffer());
      $(target).value=content;$(target).dispatchEvent(new Event('input'));
      status(notice,'已导入 TXT。');
    } catch(e) { status(notice,e instanceof TypeError?'文件不是 UTF-8 编码，请另存为 UTF-8 TXT。':e.message,true); }
  };
}
function encoded(value) {
  $('encoded').value=value;$('copy').disabled=$('save').disabled=!value;
}
let writeVersion=0,readVersion=0;
function updateCapacity() {
  const active = $('mode').value==='words';
  $('capacity').hidden = !active;
  if (!active) return;
  const available = Array.from($('cover').value.matchAll(wordingPattern)).length;
  const required = (overhead+6+Math.max(1,te.encode($('secret').value).length))*8;
  $('capacity').textContent = '原稿有 '+available+' 处可替换措辞。按当前秘密长度，至少需要 '+required+' 处。';
}
function writingChanged() {
  writeVersion++;
  encoded('');
  status('writeStatus','');
  updateCapacity();
}
for(const id of ['cover','secret','writePassword']) $(id).oninput=writingChanged;
$('mode').onchange=writingChanged;
updateCapacity();
for(const id of ['received','readPassword']) $(id).addEventListener('input',()=>readVersion++);
$('encode').onclick=async () => {
  const version=writeVersion;
  $('encode').disabled=true;encoded('');status('writeStatus','正在加密…');
  try {
    const result=await hide($('cover').value,$('secret').value,$('writePassword').value,$('mode').value);
    if(version===writeVersion){encoded(result);status('writeStatus','已生成。请复制带密文章，或保存为 TXT。');}
  } catch(e){if(version===writeVersion)status('writeStatus',e.message,true);}
  finally{$('encode').disabled=false;}
};
$('copy').onclick=async () => {
  const field=$('encoded');
  try { await navigator.clipboard.writeText(field.value); }
  catch {
    field.focus();field.select();
    try { if(!document.execCommand('copy')) throw Error(); }
    catch {status('writeStatus','带密文章已选中，请按 Ctrl+C 手动复制。');return;}
  }
  status('writeStatus','已复制带密文章。');
};
$('save').onclick=()=>{
  const url=URL.createObjectURL(new Blob(['\uFEFF',$('encoded').value],{type:'text/plain;charset=utf-8'}));
  const a=document.createElement('a');a.href=url;a.download='带密文章.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);
};
$('check').onclick=()=>{
  try{extract($('received').value);status('readStatus','找到密文。输入密码解锁，以确认内容完整。');}
  catch(e){status('readStatus',e.message,true);}
};
$('decode').onclick=async()=>{
  const version=readVersion;
  changed();$('decode').disabled=true;status('readStatus','正在解锁…');
  try{
    const result=await reveal($('received').value,$('readPassword').value);
    if(version===readVersion){$('revealed').value=result;status('readStatus','已解锁。');}
  }catch(e){if(version===readVersion)status('readStatus',e.message,true);}
  finally{$('decode').disabled=false;}
};
</script>
</html>
